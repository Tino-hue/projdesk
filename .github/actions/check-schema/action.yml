name: 'Check JSON Schema satisfiability'
description: 'Fail the build when a JSON Schema has no satisfying value at all'
author: 'Tino-hue'

inputs:
  schema:
    description: 'Path to the JSON Schema to check'
    required: true
  cwd:
    description: 'Directory the schema path is relative to (ignored when the path is absolute)'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Check that the schema has a solution
      shell: bash
      run: |
        set -uo pipefail
        schema="${{ inputs.schema }}"
        case "$schema" in
          /*) ;;
          *) schema="${{ inputs.cwd }}/$schema" ;;
        esac
        if [ ! -f "$schema" ]; then
          echo "::error::no such schema: $schema"
          exit 1
        fi
        # The kernel is committed to the repository, so nothing has to be
        # built or installed here. From this directory the CLI is three
        # levels up.
        node "${{ github.action_path }}/../../../cli/index.js" check-schema "$schema"
        status=$?
        if [ $status -ne 0 ]; then
          echo "::error::$schema has no satisfying value — see the findings above"
        fi
        exit $status
