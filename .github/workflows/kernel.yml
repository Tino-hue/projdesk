name: Kernel tests

# The kernel's own test suite runs here. The frontend CI does not build the
# MoonBit kernel: the toolchain it needs is not pinnable (only "latest" and
# "nightly" are published), and the dependency it pulls may need adjusting for
# the toolchain in use. So the kernel is compiled and tested in this workflow
# instead.

on:
  push:
    branches: [master]
    paths:
      - 'moonbit/**'
      - 'scripts/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths:
      - 'moonbit/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  kernel:
    name: MoonBit kernel tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the MoonBit toolchain
        run: |
          set -uo pipefail
          INSTALL=/tmp/moon-install.sh
          for host in https://cli.moonbitlang.com https://cli.moonbitlang.cn; do
            if curl -fsSL --max-time 90 "$host/install/unix.sh" -o "$INSTALL"; then
              echo "install script: $host"
              break
            fi
          done
          if [ ! -s "$INSTALL" ]; then
            echo "::error::could not download the MoonBit install script"
            exit 1
          fi
          # The script takes the version as a positional argument. Only the
          # "latest" and "nightly" archives are published; older releases are
          # not downloadable.
          bash "$INSTALL" latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version

      - name: Fetch the dependency and build the kernel
        run: |
          set -uo pipefail
          cd moonbit
          moon build --target wasm-gc > /tmp/build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::notice::the build failed; the dependency may need the compatibility patch"
            tail -30 /tmp/build.log
            pwsh -File ../scripts/patch_moonmodel.ps1 .mooncakes/moonbitstack/moonmodel
            moon build --target wasm-gc
          fi

      - name: moon check
        run: cd moonbit && moon check

      - name: moon test
        run: cd moonbit && moon test
