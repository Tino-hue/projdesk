name: Kernel tests

# The kernel's own test suite runs here. The frontend CI does not build the
# MoonBit kernel, so without this workflow the Actions badge says nothing
# about the MoonBit code.
#
# The toolchain cannot be pinned: the distribution host publishes only the
# "latest" and "nightly" archives, and older releases are not downloadable.
# The kernel compiles and passes its tests against both the current release
# and the older one the repository was developed against, so "latest" is
# safe to use here.

on:
  push:
    branches: [master]
    paths:
      - 'moonbit/**'
      - 'scripts/**'
      - '.github/workflows/kernel.yml'
  pull_request:
    paths:
      - 'moonbit/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  kernel:
    name: MoonBit kernel tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the MoonBit toolchain
        run: |
          set -uo pipefail
          INSTALL=/tmp/moon-install.sh
          for host in https://cli.moonbitlang.com https://cli.moonbitlang.cn; do
            if curl -fsSL --max-time 90 "$host/install/unix.sh" -o "$INSTALL"; then
              echo "install script: $host"
              break
            fi
          done
          if [ ! -s "$INSTALL" ]; then
            echo "::error::could not download the MoonBit install script"
            exit 1
          fi
          # The script takes the version as a positional argument.
          bash "$INSTALL" latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          moon version

      - name: Refresh the registry index
        # A fresh toolchain has no registry index yet, and the moonmodel
        # dependency cannot be resolved without it.
        run: moon update

      - name: Fetch the dependency and build the kernel
        run: cd moonbit && moon build --target wasm-gc

      - name: moon check
        run: cd moonbit && moon check

      - name: moon test
        run: cd moonbit && moon test
