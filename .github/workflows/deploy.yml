name: CI & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 is required: the kernel is compiled with wasm-gc, which
          # Node 20 cannot instantiate ("Unknown type code 0x50").
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The MoonBit kernel is built locally and the wasm artifact is committed to
      # the repository (web/public/projdesk.wasm). Building it in CI would tie
      # the pipeline to a specific MoonBit release: the compiler renamed the
      # 32-bit integer type between releases (Int <-> Int32), so a CI runner
      # with a different toolchain would fail to compile the same source.
      #
      # Instead, CI verifies the kernel through the WASM integration tests below,
      # which exercise the real compiled kernel end-to-end.
      - name: Frontend unit tests
        working-directory: web
        run: |
          npm ci
          npm run test

      - name: Kernel integration tests (real WASM)
        working-directory: web
        run: npm run test -- wasm.integration

      - name: Build frontend
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
