name: CI & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit registry
        run: moon update

      - name: MoonBit check
        working-directory: moonbit
        run: moon check

      - name: MoonBit format check
        working-directory: moonbit
        run: moon fmt --check

      - name: MoonBit info
        working-directory: moonbit
        run: moon info

      - name: MoonBit kernel tests
        working-directory: moonbit
        run: moon test

      - name: MoonBit build
        working-directory: moonbit
        run: moon build --target wasm-gc --release

      - name: Copy WASM
        run: |
          mkdir -p web/public cli
          cp moonbit/_build/wasm-gc/release/build/main/main.wasm web/public/projdesk.wasm
          cp moonbit/_build/wasm-gc/release/build/main/main.wasm cli/projdesk.wasm

      - name: Build & test frontend
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
