name: ProjDesk Generate

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to model JSON or .dsl file'
        required: true
        default: 'cli/example-model.json'

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 is required: the kernel is compiled with wasm-gc, which
          # Node 20 cannot instantiate ("Unknown type code 0x50").
          node-version: 24

      - name: Generate projections
        run: |
          node cli/index.js gen "${{ github.event.inputs.model_path }}" --out ./generated

      - name: Upload generated schemas
        uses: actions/upload-artifact@v4
        with:
          name: projdesk-schemas
          path: generated/
